name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        id: proj
        run: |
          set -e
          if [ ! -f settings.gradle.kts ]; then
            Z=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -z "$Z" ]; then echo "No settings.gradle.kts and no .zip found in the repo"; exit 1; fi
            mkdir -p _proj && unzip -q -o "$Z" -d _proj
          fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          D=$(dirname "$S")
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BilliardBot-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
